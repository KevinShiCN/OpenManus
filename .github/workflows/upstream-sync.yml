name: Upstream Sync

on:
  schedule:
    # 每天 UTC 0 点（北京时间上午 8 点）自动同步
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # 添加上游仓库
          git remote add upstream https://github.com/FoundationAgents/OpenManus.git

          # 获取上游更新
          git fetch upstream

          # 合并上游的 main 分支
          git merge upstream/main --no-edit --allow-unrelated-histories || true

          # 推送到 origin
          git push origin main
